name: Inspect Pixel 3 recovery artifact
on:
  push:
    branches:
      - diagnostics/blueline-recovery-20261108
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare browser inspection
        shell: bash
        run: |
          python3 -m venv /tmp/blueline-inspect
          /tmp/blueline-inspect/bin/pip install --quiet --disable-pip-version-check playwright
      - name: Locate boot image in public build
        shell: bash
        run: |
          /tmp/blueline-inspect/bin/python - <<'PY'
          import json
          import re
          import shutil
          from urllib.parse import urlsplit, urlunsplit
          from playwright.sync_api import sync_playwright
          
          page_url = "https://artifacts.serverhive.in/?id=lineage-os-blueline-20261104-042657794437"
          def display_url(value):
              parts = urlsplit(value)
              return urlunsplit((parts.scheme, parts.netloc, parts.path, "", ""))
          def on_response(response):
              content_type = response.headers.get("content-type", "")
              if "json" in content_type:
                  try:
                      body = response.text()
                      print("JSON_RESPONSE", response.status, display_url(response.url), body[:65000], flush=True)
                  except Exception as error:
                      print("RESPONSE_ERROR", type(error).__name__, flush=True)
          
          with sync_playwright() as p:
              chrome = shutil.which("google-chrome") or shutil.which("chromium")
              if not chrome:
                  raise RuntimeError("The hosted runner has no Chrome executable")
              browser = p.chromium.launch(headless=True, executable_path=chrome, args=["--disable-dev-shm-usage"])
              context = browser.new_context(accept_downloads=False)
              page = context.new_page()
              page.on("response", on_response)
              page.on("pageerror", lambda error: print("PAGE_ERROR", str(error)[:1500], flush=True))
              page.goto(page_url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(12000)
              print("PAGE_TEXT", page.locator("body").inner_text()[:50000], flush=True)
              print("ANCHORS", json.dumps(page.locator("a").evaluate_all("(els) => els.map(e => ({text:e.innerText, href:e.href}))"))[:50000], flush=True)
              print("BUTTONS", page.locator("button").all_inner_texts(), flush=True)
              browser.close()
          
          PY
