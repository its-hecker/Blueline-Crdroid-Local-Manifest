name: Validate Pixel 3 recovery kernel configuration
on:
  push:
    branches:
      - diagnostics/blueline-recovery-20261108
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch public source revisions
        shell: bash
        run: |
          git init -q /tmp/pixel3-kernel
          git -C /tmp/pixel3-kernel remote add origin https://github.com/its-hecker/android_kernel_google_msm-4.9.git
          git -C /tmp/pixel3-kernel fetch --depth=1 origin 89fd02f2a2e463e894b09a2557d65b76e6d84188
          git -C /tmp/pixel3-kernel checkout --detach FETCH_HEAD
          git clone --depth=1 --branch diagnostics/blueline-recovery-20261108 https://github.com/its-hecker/Blueline-Crdroid-Local-Manifest.git /tmp/pixel3-manifest
      - name: Reproduce missing SELinux in the original configuration
        shell: bash
        run: |
          make -s -C /tmp/pixel3-kernel O=/tmp/pixel3-config-before ARCH=arm64 CC=clang HOSTCC=gcc b1c1_defconfig
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("/tmp/pixel3-config-before/.config").read_text().splitlines()
          assert "CONFIG_SECURITY_NETWORK=y" not in lines
          assert "CONFIG_SECURITY_SELINUX=y" not in lines
          print("Original Kconfig reproduces the missing SELinux dependency.")
          PY
          set +e
          python3 /tmp/pixel3-manifest/scripts/check-kernel-config.py /tmp/pixel3-config-before/.config
          guard_status=$?
          set -e
          test "$guard_status" -eq 1
      - name: Validate the dependency fix with the kernel's Kconfig resolver
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("/tmp/pixel3-kernel/arch/arm64/configs/b1c1_defconfig")
          text = path.read_text()
          assert text.count("CONFIG_SECURITY=y\n") == 1
          assert "CONFIG_SECURITY_NETWORK=y" not in text
          text = text.replace("CONFIG_SECURITY=y\n", "CONFIG_SECURITY=y\nCONFIG_SECURITY_NETWORK=y\n")
          text = text.replace("CONFIG_SECURITY_SELINUX=y\n", "CONFIG_SECURITY_SELINUX=y\nCONFIG_DEFAULT_SECURITY_SELINUX=y\n")
          path.write_text(text)
          PY
          make -s -C /tmp/pixel3-kernel O=/tmp/pixel3-config-after ARCH=arm64 CC=clang HOSTCC=gcc b1c1_defconfig
          python3 /tmp/pixel3-manifest/scripts/check-kernel-config.py /tmp/pixel3-config-after/.config
          bash -n /tmp/pixel3-manifest/build.sh
          python3 -m py_compile /tmp/pixel3-manifest/scripts/check-kernel-config.py
