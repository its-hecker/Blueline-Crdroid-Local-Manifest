name: Inspect Pixel 3 recovery artifact
on:
  push:
    branches:
      - diagnostics/blueline-recovery-20261108
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect public ServerHive artifact index
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin
          from html.parser import HTMLParser
          
          page_url = "https://artifacts.serverhive.in/?id=lineage-os-blueline-20261104-042657794437"
          def read_url(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=40) as response:
                  body = response.read(3 * 1024 * 1024)
                  print("RESPONSE", response.status, response.headers.get("Content-Type"), url)
                  return body.decode("utf-8", errors="replace")
          
          class Index(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("src"):
                      self.scripts.append(urljoin(page_url, values["src"]))
                  if tag == "a" and values.get("href"):
                      self.links.append(urljoin(page_url, values["href"]))
          
          html = read_url(page_url)
          parser = Index()
          parser.feed(html)
          print("PAGE_HTML", html[:18000])
          print("SCRIPT_URLS", parser.scripts)
          print("LINK_URLS", parser.links)
          for url in parser.scripts[:10]:
              if not url.startswith("https://artifacts.serverhive.in/"):
                  continue
              content = read_url(url)
              print("SCRIPT_START", url)
              count = 0
              for match in re.finditer(r"fetch\(|axios|/api/|download|\.json|serverhive|\.img", content, re.I):
                  print("SNIPPET", content[max(0,match.start()-180):match.end()+300])
                  count += 1
                  if count >= 70:
                      break
              print("SCRIPT_END")
          
          PY
